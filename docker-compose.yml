services:
  mysql:
    image: mysql:8.4
    container_name: kata-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root   # только для учебной локальной БД
      MYSQL_DATABASE: kata
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mysql-data: